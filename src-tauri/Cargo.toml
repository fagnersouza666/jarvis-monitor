[package]
name = "jarvis-monitor"
version = "1.0.0"
edition = "2021"
description = "Monitor de hardware local somente leitura"
authors = ["fagnersouza666"]
default-run = "jarvis-monitor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
jarvis-telemetry = { path = "../telemetry" }

[profile.release]
opt-level = "s"
strip = true
codegen-units = 1
lto = "thin"
